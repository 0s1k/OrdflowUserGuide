site_name: Ordflow Help Center
site_description: Interactive user guide for Ordflow (app.ordflow.com)
site_url: https://0s1k.github.io/OrdflowUserGuide/
repo_url: https://github.com/0s1k/OrdflowUserGuide
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: assets/img/ordflow-logo.png
  favicon: assets/img/ordflow-logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.tabs.link

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Logging in: getting-started/login.md
      - The dashboard: getting-started/dashboard.md
  - Initial setup:
      - setup/index.md
      - General info: setup/general-info.md
      - Accounting: setup/accounting.md
      - Orders settings: setup/orders.md
      - Shipment settings: setup/shipment-settings.md
      - Sender addresses: setup/addresses.md
      - Presets: setup/presets.md
      - Integrations: setup/integrations.md
  - Orders:
      - orders/index.md
      - Import orders from Excel: orders/import.md
      - Order details: orders/order-details.md
      - Create shipping labels: orders/create-labels.md
      - Express shipments: orders/express.md
      - Shipments: orders/shipments.md
      - Shipping rules: orders/rules.md
  - Visual guide:
      - visual-guide/index.md
      - Creating an order: visual-guide/create-order.md
  - Service guide:
      - service-guide/index.md
      - Which labels go on each bag: service-guide/labels.md
      - How to label a bag: service-guide/bag-labeling.md
      - Order an Express pickup: service-guide/express-pickup.md
      - Order a Mailog driver pickup (Center): service-guide/driver-pickup.md
      - Order a pickup outside the Center (DHL): service-guide/dhl-pickup.md
      - Produce the paperwork: service-guide/paperwork.md
      - Where to route the paperwork: service-guide/paperwork-routing.md

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: he
          name: עברית
          build: true
          site_name: מרכז העזרה של Ordflow
          site_description: מדריך משתמש אינטראקטיבי ל-Ordflow (app.ordflow.com)
          nav_translations:
            Home: ראשי
            Getting started: צעדים ראשונים
            Logging in: התחברות
            The dashboard: מסך הבית
            Initial setup: הגדרות ראשוניות
            General info: פרטים כלליים
            Accounting: הנהלת חשבונות
            Orders settings: הגדרות הזמנות
            Shipment settings: הגדרות משלוחים
            Sender addresses: כתובות שולח
            Presets: פריסטים
            Integrations: חיבורים
            Orders: הזמנות
            Import orders from Excel: ייבוא הזמנות מאקסל
            Order details: פרטי הזמנה
            Create shipping labels: הפקת מדבקות משלוח
            Express shipments: משלוחי אקספרס
            Shipments: משלוחים
            Shipping rules: כללי משלוח
            Visual guide: מדריך חזותי
            Creating an order: יצירת הזמנה
            Service guide: מדריך שירותים
            Which labels go on each bag: אילו מדבקות על כל שקית
            How to label a bag: איך להדביק מדבקה על שקית
            Order an Express pickup: הזמנת איסוף אקספרס
            Order a Mailog driver pickup (Center): הזמנת איסוף על ידי נהג Mailog (מרכז)
            Order a pickup outside the Center (DHL): הזמנת איסוף מחוץ למרכז (DHL)
            Produce the paperwork: הפקת מסמכים
            Where to route the paperwork: לאן שולחים את המסמכים

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/hotspots.js
  - javascripts/service-finder.js

